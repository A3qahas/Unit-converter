<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="a-header">
    <div id="header">
    <p id="title">Metric/Imperial Unit Conversion</p>
    <input type="number" id="input-el" placeholder="Number">
    <button id="btn">Convert</button>
    </div>

    <div id="s-header">
        <div id="Length-el">
        <p class="l-title">Length (Meter/Feet)</p>
        <p class="l-result" id="m-Rid">meters =  feet | feet = meters</p>
    </div>

    <div id="t-header">
        <div id="Length-el">
        <p class="l-title">Volume (Liters/Gallons)</p>
        <p class="l-result" id="l-r">liters = gallons | 20 gallons = 75.708 liters</p>
    </div>

    <div id="f-header">
        <div id="Length-el">
        <p class="l-title">Mass (Kilograms/Pounds)</p>
        <p class="l-result" id="k-r"> kilos = pounds | pounds = kilos</p>
    </div>

    </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
